
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Mini Map Editor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="container">

        <aside id="toolbar">
            <div class="toolbar-header">
                <h1>Draw.</h1>
                <p>Mini Map Editor</p>
            </div>

            <div class="toolbar-section">
                <h2>Brush Settings</h2>

                <label for="stroke">Stroke Color</label>
                <input
                    id="stroke"
                    name="stroke"
                    type="color"
                    value="#ffffff"
                >

                <label for="lineWidth">Line Width</label>
                <input
                    id="lineWidth"
                    name="lineWidth"
                    type="number"
                    min="1"
                    max="100"
                    value="5"
                >

                <div class="button-groups">
                    <button id="terrain1">
                        <img src="terrain1.avif" alt="" width="100">
                    </button>
                    <button id="water">
                        <img src="water.jpg" alt="" width="100">
                    </button>
                </div>
            </div>

            <div class="toolbar-footer">
                <button id="clear">Clear Canvas</button>
            </div>
        </aside>

        <main class="workspace">
            <header class="workspace-header">
                <div>
                    <h2>Canvas Workspace</h2>
                    <p>Your creative space</p>
                </div>

                <span class="status">● Ready to draw</span>
            </header>

            <div class="canvas-container">
                <canvas id="drawing-board"></canvas>
            </div>
        </main>

    </section>

    <script src="app.js"></script>
</body>
</html>
